# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  NAME: "zensical"
  VERSION: "0.0.50"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  clean:
    aliases: [c]
    desc: Clean up
    cmds:
      - find . -type d -name ".terraform" -prune -exec rm -rf {} +
      - find . -name ".DS_Store" -delete
      - find . -name ".terraform.lock.hcl" -delete
      - find . -name "hash" -delete
      - find . -name "terraform.tfstate" -delete
      - find . -name "terraform.tfstate.backup" -delete

  build:
    aliases: [b]
    desc: Build and export to the registry
    cmds:
      - time docker buildx build --platform linux/amd64,linux/arm64 --output=type=registry --tag sig9/{{.NAME}}:latest --tag sig9/{{.NAME}}:{{.VERSION}} versions/{{.VERSION}}/

  tags:
    desc: List the tags registered on Docker Hub
    cmds:
      - skopeo list-tags docker://docker.io/sig9/{{.NAME}} | jq -r '.Tags[]' | sort -V
